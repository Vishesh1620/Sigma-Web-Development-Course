<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Multicor website</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap');
    </style>

    <style>
        /* :root {
            --primary-color: rgb(141, 45, 232);
            --text-color: white;
            --secondary-color: rgb(219, 192, 244);
        } */
        :root {
            --primary-color: rgb(28, 196, 45);
            --text-color: white;
            --secondary-color: rgb(21, 190, 168);
        }

        body {
            background-color: var(--secondary-color);
        }

        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        nav {
            background-color: var(--primary-color);
            padding: 12px 10px;
        }

        ul li {
            list-style-type: none;
            color: var(--text-color);
            display: inline;
            padding: 23px;
            font-weight: bolder;

        }



        ul li a {
            color: var(--text-color);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact Us</a></li>
            </ul>
        </nav>
    </header>
</body>

</html>
